name: CI/CD Pipeline

on:
  push:
    branches: ['main', 'master']
  pull_request:
    branches: ['main', 'master']

jobs:
  # ==========================================
  # Job 1: Kiểm tra chất lượng mã nguồn (CI)
  # ==========================================
  quality-check:
    name: Code Quality Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run linter
        run: pnpm lint

      - name: Check code formatting
        run: pnpm format:check
  # ==========================================
  # Job 2: Đóng gói và Đẩy lên Docker Hub (CD)
  # ==========================================
  docker-build-push:
    name: Build & Push Docker Image

    # 1. 'needs': Đảm bảo chỉ khi Job CI (quality-check) chạy XANH (PASS)
    # thì mới cho phép chạy tiếp CD. Nếu code lỗi lint/format -> Dừng ngay lập tức!
    needs: quality-check

    runs-on: ubuntu-latest

    # 2. 'if': Điều kiện bảo vệ. Chỉ đẩy Image lên Docker Hub khi code được PUSH vào nhánh chính (main/master).
    # Nếu ai đó tạo nhánh phụ hoặc Pull Request để thử nghiệm -> KHÔNG đẩy lên Docker Hub.
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      # Bước 1: Kéo mã nguồn về máy ảo mới của Job 2
      - name: Checkout repository
        uses: actions/checkout@v4

      # Bước 2: Set up QEMU (Trình giả lập phần cứng)
      # Giúp build Docker Image tương thích với nhiều loại chip CPU (Intel/AMD x86, Apple Silicon ARM64,...)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Bước 3: Set up Docker Buildx (Bộ công cụ build thế hệ mới của Docker)
      # Cho phép build nhanh hơn nhờ cache thông minh và hỗ trợ đẩy thẳng Image lên Cloud
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Bước 4: Tự động Đăng nhập vào tài khoản Docker Hub
      # Thay vì gõ mật khẩu lộ liễu, GitHub sẽ lấy 2 biến bí mật đã mã hóa trong Secrets
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }} # Tên tài khoản (xacee)
          password: ${{ secrets.DOCKERHUB_TOKEN }} # Access Token bí mật

      # Bước 5: Build mã nguồn thành Docker Image và ĐẨY (PUSH) lên Docker Hub
      - name: Build and Push to Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: . # Lấy mã nguồn ở thư mục hiện tại
          file: ./Dockerfile # Đọc các chỉ thị từ file Dockerfile
          push: true # 'true' = Build xong tự động upload lên Docker Hub
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/acquisitions-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/acquisitions-api:${{ github.sha }}
      
      - name : Trigger render deploy hook
        run : curl -X POST https://api.render.com/deploy/srv-db1mnrmgekts73ej4qug?key=Ir3sy-OBOLs 